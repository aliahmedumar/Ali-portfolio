server {
    listen 80;
    listen [::]:80;
    server_name ali.cloudordinate.com;

    root /var/www/ali.cloudordinate.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
