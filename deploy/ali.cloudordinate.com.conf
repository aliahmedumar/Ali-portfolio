server {
    # Ports 80/443 belong to the Docker reverse proxy; it forwards ali.cloudordinate.com here.
    listen 8088;
    server_name ali.cloudordinate.com;

    root /var/www/ali.cloudordinate.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16k;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
