name: Deploy to Oracle VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  VPS_HOST: 139.185.40.101
  VPS_USER: opc
  SITE_DIR: /var/www/ali.cloudordinate.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          [ -n "$VPS_SSH_KEY" ] || { echo "::error::VPS_SSH_KEY repository secret is empty or missing"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload site
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            --include='index.html' --include='assets/***' --exclude='*' \
            ./ "$VPS_USER@$VPS_HOST:~/site-staging/"

      - name: Publish
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "
            sudo mkdir -p $SITE_DIR &&
            sudo rsync -a --delete ~/site-staging/ $SITE_DIR/ &&
            sudo chown -R nginx:nginx $SITE_DIR &&
            (command -v restorecon >/dev/null && sudo restorecon -R $SITE_DIR || true) &&
            sudo nginx -t && sudo systemctl reload nginx
          "
